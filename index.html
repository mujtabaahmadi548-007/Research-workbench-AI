<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b59e0'/%3E%3Cg stroke='white' stroke-width='2.2' fill='none'%3E%3Cpath d='M10 22 16 10 22 22'/%3E%3C/g%3E%3Cg fill='white'%3E%3Ccircle cx='10' cy='22' r='3'/%3E%3Ccircle cx='16' cy='10' r='3'/%3E%3Ccircle cx='22' cy='22' r='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface-2:#f0eee7; --surface-3:#e7e5dc;
  --ink:#1a1b1e; --ink-2:#46484e; --ink-3:#76787f; --line:#e2e0d8; --line-2:#cdcabf;
  --accent:#2b59e0; --accent-ink:#ffffff; --accent-soft:#e7edfd;
  --good:#16804a; --good-soft:#e2f3e8; --warn:#a2560a; --warn-soft:#fbeedb; --bad:#c02d2d; --bad-soft:#f9e6e6;
  --c1:#2b59e0; --c2:#d4551a; --c3:#0f8a78; --c4:#8a4ad1; --c5:#b38410; --c6:#8b8d93;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 6px 20px rgba(20,20,30,.05);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1012; --surface:#17181b; --surface-2:#1f2024; --surface-3:#2a2b30;
    --ink:#ecebe6; --ink-2:#b6b5ae; --ink-3:#86857f; --line:#2a2c31; --line-2:#3b3d43;
    --accent:#7d9bff; --accent-ink:#0d1020; --accent-soft:#1c2440;
    --good:#4cc38a; --good-soft:#15291f; --warn:#f0a75e; --warn-soft:#2f2212; --bad:#f07a7a; --bad-soft:#341818;
    --c1:#7d9bff; --c2:#ff8c54; --c3:#3ccab6; --c4:#c595f2; --c5:#e3b341; --c6:#8b8d93;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;margin:0}
h1{font-size:28px;font-weight:650;line-height:1.2}
h2{font-size:19px;font-weight:650}
h3{font-size:15px;font-weight:650}
code,.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.hidden{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand b{display:block;font-family:var(--font-display);font-size:15.5px;line-height:1.2}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:600;font-size:14.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11.5px;padding:0 7px;line-height:19px;min-width:19px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-3);padding:0 6px}
.side-foot .src{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)}.dot.running{background:var(--accent);animation:pulse 1s infinite alternate}
.dot.offline,.dot.rate_limited,.dot.partial{background:var(--warn)}.dot.error{background:var(--bad)}.dot.never{background:var(--line-2)}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
main{min-width:0;width:100%;max-width:1240px;padding:30px 40px 80px}
main.wide{max-width:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;z-index:30;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand small,.side-foot,.nav a span.lbl-long{display:none}
  .brand b{font-size:14px}
  .nav{flex-direction:row}
  .nav a{padding:7px 9px;font-size:13.5px;gap:6px}
  main{padding:18px 16px 60px}
  h1{font-size:23px}
}

/* generic pieces */
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head .sub{margin:6px 0 0;color:var(--ink-2);max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn svg{width:16px;height:16px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:20px}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--line);margin:22px 0 18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 14px;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{accent-color:var(--accent);width:100%;margin:0}
textarea{width:100%;resize:vertical;min-height:80px}
.note{padding:11px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.loading{padding:30px 0;color:var(--ink-3)}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-3)}

/* feed */
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.srccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.srccard .top{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.srccard .msg{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.srccard .when{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.sources{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 10px}
.toolbar .search input{border:0;box-shadow:none;flex:1;padding:8px 0;background:transparent}
.toolbar .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar .search svg{width:16px;height:16px;color:var(--ink-3)}
.listmeta{font-size:13px;color:var(--ink-3);margin:0 0 8px}
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.prow{display:flex;gap:16px;padding:14px 18px;border-top:1px solid var(--line);color:var(--ink)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2);text-decoration:none}
.prow-main{flex:1;min-width:0}
.prow-title{font-weight:650;font-size:15.5px;line-height:1.35}
.prow-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.prow-abs{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.upv{font-weight:700;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.prow{flex-direction:column;gap:8px}.prow-side{flex-direction:row;align-items:center;flex-wrap:wrap}}
/* images, importance, freshness */
.thumb{flex:none;width:150px;aspect-ratio:16/10;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);position:relative;align-self:flex-start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.figure img{object-fit:contain;background:#fff}
.thumb svg{width:100%;height:100%;display:block}
.thumb .kind{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:0 6px;line-height:17px}
@media (max-width:640px){.thumb{width:100%;aspect-ratio:2/1}}
.imp{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:help}
.imp .meter{width:52px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.imp .meter i{display:block;height:100%;border-radius:3px;background:var(--c6)}
.imp.t-major .meter i{background:var(--c2)}.imp.t-major{color:var(--c2)}
.imp.t-high .meter i{background:var(--accent)}.imp.t-high{color:var(--accent)}
.imp.t-notable .meter i{background:var(--c3)}
.imp.t-none{color:var(--ink-3);font-weight:600}
.hero{max-width:900px;margin:16px 0 4px}
.hero figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.hero .stage{background:#fff;display:grid;place-items:center;min-height:120px}
.hero .stage img{display:block;width:100%;max-height:470px;object-fit:contain}
.hero .stage video{display:block;width:100%;max-height:470px;background:#000}
.hero .stage svg{display:block;width:100%;height:auto;max-height:300px}
.hero figcaption{color:var(--ink-2);font-size:13.5px;padding:10px 14px;border-top:1px solid var(--line)}
.hero figcaption b{color:var(--ink)}
.gallery{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 4px;max-width:900px}
.gallery button{flex:none;width:120px;aspect-ratio:16/10;border:2px solid var(--line);border-radius:9px;overflow:hidden;padding:0;background:#fff;cursor:pointer;position:relative}
.gallery button.on{border-color:var(--accent)}
.gallery img{width:100%;height:100%;object-fit:contain;display:block}
.gallery .vid{display:grid;place-items:center;width:100%;height:100%;background:#111;color:#fff;font-weight:700;font-size:13px}
.why{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;max-width:900px;margin:14px 0 16px}
@media (max-width:760px){.why{grid-template-columns:minmax(0,1fr)}}
.why h3{margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.score b{font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.part .bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.part .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.part .pts{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.part .det{grid-column:2 / 4;margin-top:-6px;color:var(--ink-3);font-size:12px}
@media (max-width:480px){.part{grid-template-columns:96px minmax(0,1fr) 40px}}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.timeline li b{min-width:64px;font-variant-numeric:tabular-nums}
.timeline li span{color:var(--ink-3);font-size:13px}
.repo .banner{display:block;margin:-14px -16px 6px;aspect-ratio:2/1;background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden}
.repo .banner img{width:100%;height:100%;object-fit:cover;display:block}
.repo .name{display:flex;gap:8px;align-items:center}
.repo .name img{width:22px;height:22px;border-radius:6px;flex:none}
/* news */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ev:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ev .ev-img{display:block;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden;position:relative}
.ev .ev-img img{width:100%;height:100%;object-fit:cover;display:block}
.ev .ev-img svg{width:100%;height:100%;display:block}
.ev .ev-img .kind{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:1px 8px;line-height:19px}
.ev-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.ev-src{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.ev-src b{color:var(--ink-2);font-weight:650}
.ev-title{font-weight:680;font-size:16px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.ev-title:hover{color:var(--accent);text-decoration:none}
.ev-sum{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev-chips{display:flex;flex-wrap:wrap;gap:5px}
.ev-foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-top:auto;padding-top:4px}
.ev-foot a{color:var(--ink-2);font-weight:600}
.ev details{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.ev details summary{cursor:pointer;color:var(--accent);font-weight:600}
.ev details ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ev details li{line-height:1.35}
.ev details li span{color:var(--ink-3);font-size:12px;margin-right:6px}
.ev.lead{grid-column:span 2}
.ev.lead .ev-img{aspect-ratio:21/9}
.ev.lead .ev-title{font-size:20px}
.ev.lead .ev-sum{-webkit-line-clamp:4}
@media (max-width:700px){.ev.lead{grid-column:auto}.ev.lead .ev-title{font-size:17px}}
.stype{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;line-height:18px;background:var(--surface-2);color:var(--ink-2)}
.stype.lab{background:var(--accent-soft);color:var(--accent)}
.stype.hub{background:var(--good-soft);color:var(--good)}
.stype.community{background:var(--warn-soft);color:var(--warn)}
.feedlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.feedlist span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2)}
details.feeds{margin:10px 0 0}
details.feeds summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600}
/* news v2: pills, actions, brief, compact view */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pills2{display:flex;flex-wrap:wrap;gap:6px}
.p2{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;line-height:20px;padding:0 8px;border-radius:6px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p2.src-lab{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.p2.src-hub{background:var(--good-soft);color:var(--good);border-color:transparent}
.p2.src-community{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p2.src-repo{background:var(--surface-3);color:var(--ink);border-color:transparent}
.p2.cat{background:transparent}
.p2.spec{font-family:var(--mono);font-weight:600}
.p2.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.p2.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p2.corro{background:transparent;border-style:dashed}
.ev.unread .ev-title::before,.crow.unread .ev-title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
ul.triage{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
ul.triage b{color:var(--ink);font-weight:650}
.ev-actions{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.also{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.also-h{font-weight:650;color:var(--ink-2);font-size:12.5px;margin-bottom:5px}
.also ul,.finder ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.also li,.finder li{line-height:1.35}
.also li a{font-weight:600}
.also li span{color:var(--ink-3);font-size:12px}
.also details{margin-top:5px}
.also details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
.also details ul{margin-top:5px}
.finder{font-size:13px;background:var(--surface-2);border-radius:9px;padding:9px 11px}

    h('span', { class: 'badge' }, q.qtype === 'mcq' ? 'Multiple choice' : 'Free recall'),
    q.news_id ? h('span', { class: 'badge accent' }, 'From News') : null,
    q.news_id ? h('a', { href: safeUrl(q.news_url) || '#/news', target: '_blank', rel: 'noopener noreferrer' }, `${q.news_source || 'News'}: ${q.paper_title || ''}`)
      : h('a', { href: '#/paper/' + q.arxiv_id }, q.paper_title));
  const body = [];
  if (q.qtype === 'mcq') {
    body.push(h('div', { class: 'opts' }, q.options.map((o, k) => {
      let cls = 'opt';
      if (rv.revealed) { if (k === q.answer_index) cls += ' right'; else if (k === rv.chosen) cls += ' wrong'; }
      return h('button', { class: cls, disabled: rv.revealed, onclick: () => choose(k) }, h('span', { class: 'k' }, 'ABCDEF'[k]), h('span', null, o));
    })));
    if (!rv.revealed) body.push(h('p', { class: 'muted small', style: { marginTop: '12px' } }, 'Pick an answer (keys ', h('span', { class: 'kbd' }, 'A'), '–', h('span', { class: 'kbd' }, 'D'), ').'));
  } else {
    body.push(h('textarea', { id: 'rvAnswer', placeholder: 'Write your answer from memory (optional, only you see it)…', disabled: rv.revealed }));
    if (!rv.revealed) body.push(h('div', { style: { marginTop: '12px' } }, h('button', { class: 'btn primary', onclick: reveal }, 'Show answer'), h('span', { class: 'muted small', style: { marginLeft: '10px' } }, 'or press ', h('span', { class: 'kbd' }, 'Space'))));
  }
  if (rv.revealed) {
    const correct = q.qtype === 'mcq' ? rv.chosen === q.answer_index : null;
    const suggest = correct === null ? 'good' : correct ? 'good' : 'again';
    body.push(h('div', { class: 'reveal' },
      q.qtype === 'mcq' ? h('div', { class: 'note ' + (correct ? 'good' : 'bad'), style: { marginBottom: '10px' } }, correct ? 'Correct.' : `Not quite. The answer is ${'ABCDEF'[q.answer_index]}.`) : h('div', { class: 'ansbox' }, h('b', null, 'Model answer: '), q.answer),
      h('p', { style: { margin: '0', color: 'var(--ink-2)' } }, q.explanation),
      h('div', { class: 'grades' }, [['again', 'Again'], ['hard', 'Hard'], ['good', 'Good'], ['easy', 'Easy']].map(([g, label], k) =>
        h('button', { class: `grade ${g}${g === suggest ? ' suggest' : ''}`, onclick: () => grade(g) }, h('span', null, label), h('small', null, `${q.preview[g]} · key ${k + 1}`))))));
  }
  box.replaceChildren(h('div', { class: 'rcard' }, meta, h('div', { class: 'prompt' }, q.prompt), ...body));
}
function choose(k) { if (rv.revealed) return; rv.chosen = k; rv.revealed = true; drawCard(); }
function reveal() { rv.revealed = true; const ta = $('#rvAnswer'); const keep = ta ? ta.value : ''; drawCard(); const t2 = $('#rvAnswer'); if (t2) t2.value = keep; }
let grading = false;
async function grade(g) {
  const q = rv.items[rv.i]; if (!q || grading) return;
  grading = true;
  try {
    const r = await api('/api/review/' + q.id, { method: 'POST', body: { grade: g } });
    toast(`Next review in ${r.next_in}.`);
    rv.i++; rv.revealed = false; rv.chosen = null;
    if (rv.i >= rv.items.length) await loadReview(); else { const st = await api('/api/review/stats'); rv.stats = { ...rv.stats, ...st }; drawReviewStats(); drawCard(); }
    pollStatus();
  } catch (e) { toast(e.message, 'bad'); }
  finally { grading = false; }
}

/* ======================================================================
   Settings
   ====================================================================== */
async function renderSettings(ctx) {
  const { main } = ctx;
  main.append(h('header', { class: 'view-head' }, h('div', null, h('h1', null, 'Settings'), h('p', { class: 'sub' }, 'Everything is stored locally in workbench.db next to server.py. Nothing here is sent anywhere except your Gemini key, which goes only to Google\'s Gemini API.'))));
  let st;
  try { st = await api('/api/settings'); } catch (e) { main.append(h('div', { class: 'note bad' }, e.message)); return; }
  if (!ctx.alive()) return;
  const keyInput = h('input', { type: 'password', placeholder: st.has_key ? `Saved key ${st.key_hint || ''} (paste a new one to replace it)` : 'Paste your Gemini API key', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Gemini API key' });
  const keyStatus = h('div', { class: 'help' });
  const modelInput = h('input', { type: 'text', value: st.model || '', list: 'modelList', 'aria-label': 'Gemini model', spellcheck: 'false' });
  const modelList = h('datalist', { id: 'modelList' });
  const modelMsg = h('div', { class: 'help' }, `Default: ${st.default_model} (an alias Google keeps pointed at the current Flash model). Use “Check key & list models” to pick from the models your key can use.`);
  const drawKeyStatus = s2 => keyStatus.replaceChildren(s2.has_key ? h('span', { class: 'badge good' }, `Key saved ${s2.key_hint || ''}`) : h('span', { class: 'badge warn' }, 'No key saved'), ' ', 'Get a free key at ', h('a', { href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener noreferrer' }, 'Google AI Studio ↗'), '.');
  drawKeyStatus(st);
  const keyErr = h('div', { class: 'note bad hidden', role: 'alert' });
  const save = async (body, okMsg, errBox) => {
    if (errBox) errBox.classList.add('hidden');
    try { st = await api('/api/settings', { method: 'POST', body }); toast(okMsg); drawKeyStatus(st); pollStatus(); return true; }
    catch (e) { if (errBox) { errBox.textContent = 'Not saved: ' + e.message; errBox.classList.remove('hidden'); } else toast(e.message, 'bad'); return false; }
  };
  const checkBtn = h('button', { class: 'btn', onclick: async () => {
    checkBtn.disabled = true; modelMsg.textContent = 'Checking the key with Google…';
    try { const r = await api('/api/gemini/models', { method: 'POST', body: {} }); modelList.replaceChildren(...r.models.map(m => h('option', { value: m }))); modelMsg.replaceChildren(h('span', { class: 'badge good' }, 'Key works'), ' ', `${r.models.length} models available. Click the model box to choose. Flash models are listed first.`); }
    catch (e) { modelMsg.replaceChildren(h('span', { class: 'badge bad' }, 'Problem'), ' ', e.message); }
    finally { checkBtn.disabled = false; }
  } }, 'Check key & list models');
  const fetchBox = h('input', { type: 'checkbox', checked: st.fetch_on_startup });
  const figBox = h('input', { type: 'checkbox', checked: st.fetch_figures });
  const fallbackBox = h('input', { type: 'checkbox', checked: st.gemini_fallback, onchange: () => save({ gemini_fallback: fallbackBox.checked }, fallbackBox.checked ? 'Fallback model on.' : 'Fallback model off.') });
  const feedsTa = h('textarea', { rows: 3, placeholder: 'https://example.com/feed.xml', spellcheck: 'false', 'aria-label': 'Extra RSS or Atom feeds' });
  feedsTa.value = (st.custom_feeds || []).join('\n');
  const arxivN = h('input', { type: 'number', min: 10, max: 200, value: st.arxiv_max_results, style: { width: '110px' } });
  const hfN = h('input', { type: 'number', min: 10, max: 100, value: st.hf_limit, style: { width: '110px' } });
  const newN = h('input', { type: 'number', min: 0, max: 500, value: st.new_per_day, style: { width: '110px' } });
  const queueBox = h('div', null, h('div', { class: 'loading' }, 'Loading…'));
  main.append(h('div', { class: 'set-grid' },
    h('section', { class: 'card' }, h('h2', { style: { marginBottom: '14px' } }, 'Gemini'),
      h('div', { class: 'field' }, h('label', null, 'API key'),
        h('div', { class: 'row' }, keyInput,
          h('button', { class: 'btn primary', onclick: async () => { const v = keyInput.value.trim(); if (!v) { keyErr.textContent = 'Paste a key first.'; keyErr.classList.remove('hidden'); return; } if (await save({ gemini_api_key: v }, 'Key saved. Queued papers will start automatically.', keyErr)) { keyInput.value = ''; keyInput.placeholder = `Saved key ${st.key_hint || ''} (paste a new one to replace it)`; } } }, 'Save key'),
          st.has_key ? h('button', { class: 'btn danger', onclick: async () => { if (confirm('Remove the saved Gemini key from this computer?')) { await save({ clear_key: true }, 'Key removed.'); keyInput.placeholder = 'Paste your Gemini API key'; } } }, 'Remove') : null),
        keyErr, keyStatus),
      h('div', { class: 'field' }, h('label', null, 'Model'),
        h('div', { class: 'row' }, modelInput, modelList, h('button', { class: 'btn', onclick: () => save({ gemini_model: modelInput.value.trim() }, 'Model saved.') }, 'Save model'), checkBtn),
        modelMsg),
      h('div', { class: 'field' }, h('label', { class: 'check' }, fallbackBox, 'When the model is overloaded, retry and then use another Flash model'),
        h('div', { class: 'help' }, 'Google sometimes answers "HTTP 503: experiencing high demand". The app retries twice with a short wait, then tries one other Flash model your key can use (chosen from Google\'s model list). The page shows which model answered.'))),
    h('section', { class: 'card' }, h('h2', { style: { marginBottom: '14px' } }, 'Live ingestion'),
      h('div', { class: 'field' }, h('label', { class: 'check' }, fetchBox, 'Fetch all sources when the server starts')),
      h('div', { class: 'field' }, h('label', { class: 'check' }, figBox, 'Download paper figures from arXiv in the background'),
        h('div', { class: 'help' }, 'One paper every 15 seconds, as arXiv\'s robots.txt asks. Figures for a paper you open are always loaded right away.')),
      h('div', { class: 'field' }, h('label', null, 'Papers per refresh'), h('div', { class: 'row' }, h('span', { class: 'small muted' }, 'arXiv'), arxivN, h('span', { class: 'small muted' }, 'Hugging Face'), hfN), h('div', { class: 'help' }, 'arXiv asks for at least 3 seconds between requests; the server enforces that. GitHub is checked at most every 30 minutes for releases (60 requests/hour without a token).')),
      h('div', { class: 'field' }, h('label', null, 'Extra news feeds (RSS or Atom, one URL per line)'), feedsTa,
        h('div', { class: 'help' }, 'Added to the News page on the next Refresh. Useful for labs or newsletters not included by default. Up to 20.')),
      h('button', { class: 'btn primary', onclick: () => save({ fetch_on_startup: fetchBox.checked, fetch_figures: figBox.checked, arxiv_max_results: +arxivN.value, hf_limit: +hfN.value, custom_feeds: feedsTa.value.split('\n').map(x => x.trim()).filter(Boolean) }, 'Ingestion settings saved.') }, 'Save')),
    h('section', { class: 'card' }, h('h2', { style: { marginBottom: '14px' } }, 'Review'),
      h('div', { class: 'field' }, h('label', null, 'New questions per day'), h('div', { class: 'row' }, newN, h('button', { class: 'btn primary', onclick: () => save({ new_per_day: +newN.value }, 'Review settings saved.') }, 'Save')))),
    h('section', { class: 'card' }, h('h2', { style: { marginBottom: '6px' } }, 'Analysis queue'),
      h('p', { class: 'muted small', style: { marginTop: 0 } }, 'Papers waiting for Gemini. Rate-limited and offline items retry automatically with backoff.'), queueBox),
    h('section', { class: 'card' }, h('h2', { style: { marginBottom: '8px' } }, 'Data'),
      h('p', { class: 'small', style: { margin: 0 } }, 'Database file: ', h('code', { class: 'path' }, st.db_path)),
      h('p', { class: 'small muted' }, 'Delete that file (with the server stopped) to start fresh. The starter papers are re-created on the next start. The included .gitignore keeps the database, and therefore your key, out of git.'))));
  const loadQueue = async () => {
    try {
      const q = await api('/api/queue');
      if (!q.items.length) { queueBox.replaceChildren(h('p', { class: 'muted small', style: { margin: 0 } }, 'The queue is empty.')); return; }
      queueBox.replaceChildren(h('div', { class: 'tblwrap', style: { marginTop: 0 } }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, ['Paper', 'Status', 'Details', ''].map(t => h('th', null, t)))),
        h('tbody', null, q.items.map(it => h('tr', null,
          h('td', null, h('a', { href: '#/paper/' + it.arxiv_id }, it.title || it.arxiv_id)),
          h('td', null, h('span', { class: 'badge ' + (it.status === 'error' ? 'bad' : 'warn') }, queueLabel(it.status))),
          h('td', { class: 'small' }, it.message || '', it.attempts ? ` (attempts: ${it.attempts})` : ''),
          h('td', { style: { whiteSpace: 'nowrap' } },
            h('button', { class: 'btn sm', onclick: async () => { try { await api(`/api/queue/${it.arxiv_id}/retry`, { method: 'POST', body: {} }); toast('Retrying.'); loadQueue(); pollStatus(); } catch (e) { toast(e.message, 'bad'); } } }, 'Retry'), ' ',
            h('button', { class: 'btn sm ghost', onclick: async () => { try { await api(`/api/queue/${it.arxiv_id}`, { method: 'DELETE' }); loadQueue(); } catch (e) { toast(e.message, 'bad'); } } }, 'Remove'))))))));
    } catch (e) { queueBox.replaceChildren(h('div', { class: 'note bad' }, e.message)); }
  };
  loadQueue();
  const t = setInterval(() => { if (ctx.alive()) loadQueue(); }, 5000);
  app.cleanup.push(() => clearInterval(t));
}

/* ======================================================================
   Boot
   ====================================================================== */
(async function boot() {
  try { const g = await api('/api/graph'); g.concepts.forEach(c => { CONCEPT_LABELS[c.id] = c.label; }); } catch (e) { /* labels fall back to ids */ }
  route();
  pollStatus();
})();
</script>
</body>
