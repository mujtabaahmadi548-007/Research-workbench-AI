# Keeps the website (GitHub Pages) live: fetches the sources and republishes about every 5 minutes. Open pages
# also check Hacker News and Bluesky themselves every minute (index.html, "Live layer").
# One-time setup: GitHub -> Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions.
# Optional: a repository secret GEMINI_API_KEY makes an update (at most every 4 hours, to protect the free quota)
# also write the Frontier Brief, triage the top stories and break down 2 top papers. Without it the site still
# works; you can add your key in the site's Settings.
#
# Why a chain: GitHub delays and drops cron schedules (the old "every 4 hours" schedule really ran every 6-10
# hours). So each run publishes the site and then starts the next run itself, 5 minutes after it began. The hourly
# schedule is only a backup that restarts the chain if it ever breaks; the concurrency group keeps it to one run
# at a time. Actions minutes are free for public repositories.
name: Update website

on:
  schedule:
    - cron: "23 * * * *"     # backup only; each run starts the next one (see the "next" job)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
    inputs:
      refresh:
        description: "Fetch fresh news and papers (off = just republish)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["index.html", "server.py", "news_intel.py", "build_site.py", "requirements.txt", ".github/workflows/update-site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      t0: ${{ steps.clock.outputs.t0 }}
    steps:
      - id: clock
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database carries history between runs (first-seen times, figures, Gemini breakdowns).
      - uses: actions/cache/restore@v4
        with:
          path: ci-data/workbench.db
          key: workbench-db-${{ github.run_id }}
          restore-keys: workbench-db-

      # Highest alerts found by the alerts workflow (shown at the top of the News page)
      - uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Fetch sources and build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKBENCH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables) to change the
          # Gemini models without code. Empty = the defaults in server.py (filter gemini-3.5-flash-lite, embeddings
          # gemini-embedding-001, deep gemini-3.8-flash).
          WORKBENCH_MODEL_FILTER: ${{ vars.GEMINI_MODEL_FILTER }}
          WORKBENCH_MODEL_EMBED: ${{ vars.GEMINI_MODEL_EMBED }}
          WORKBENCH_MODEL_DEEP: ${{ vars.GEMINI_MODEL_DEEP }}
          # X page (optional): secret X_API_KEY = an X API bearer token, or a twitterapi.io key with the repository
          # variable X_API_PROVIDER = twitterapi. Optional variables: X_DAILY_CAP (posts per day, default 100) and
          # X_ACCOUNTS ("AnthropicAI:lab, karpathy:people, ...").
          WORKBENCH_X_KEY: ${{ secrets.X_API_KEY }}
          WORKBENCH_X_PROVIDER: ${{ vars.X_API_PROVIDER }}
          WORKBENCH_X_DAILY_CAP: ${{ vars.X_DAILY_CAP }}
          WORKBENCH_X_ACCOUNTS: ${{ vars.X_ACCOUNTS }}
          REFRESH: ${{ (github.event_name != 'workflow_dispatch' || inputs.refresh) && '--refresh' || '' }}
        run: python build_site.py --db ci-data/workbench.db --save-db ci-data/workbench.db --site site --alerts alerts/state.json --figures 1 --gemini-every 4 $REFRESH

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ci-data/workbench.db
          key: workbench-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Starts the next update 5 minutes after this one began (30 minutes after a failed one, so a broken build
  # cannot spin). Runs even when the build or the deploy failed, so one bad run never stops the updates.
  #
  # It also keeps the whole setup alive for the long run:
  # - Keep-alive: GitHub switches scheduled workflows off in a public repository with no activity for 60 days,
  #   and a switched-off workflow cannot be started at all. So every run re-enables both workflows through the
  #   API, and when the newest commit is over 30 days old it commits a small heartbeat file (.github/heartbeat.txt).
  # - Watchdog: if the Highest alerts loop is not running, it is started again (that loop watches this chain too).
  next:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write      # only for the monthly heartbeat commit
    steps:
      - name: Wait, keep everything alive, then start the next update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T0: ${{ needs.build.outputs.t0 }}
          OK: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' }}
        run: |
          set +e
          R="$GITHUB_REPOSITORY"
          now=$(date +%s)
          interval=300
          [ "$OK" = "true" ] || interval=1800
          wait=$(( interval - (now - ${T0:-$now}) ))
          if [ "$wait" -gt 0 ]; then echo "Next update in $wait s."; sleep "$wait"; fi

          for wf in update-site.yml alerts.yml; do
            gh api -X PUT "repos/$R/actions/workflows/$wf/enable" >/dev/null || echo "Keep-alive: could not re-enable $wf."
          done
          last=$(gh api "repos/$R/commits?per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt $((30 * 86400)) ]; then
            sha=$(gh api "repos/$R/contents/.github/heartbeat.txt" --jq '.sha' 2>/dev/null)
            echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || sha=""
            text="This file is updated automatically when the repository has had no commit for 30 days, so that GitHub keeps the scheduled website updates and alerts switched on. Last heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api -X PUT "repos/$R/contents/.github/heartbeat.txt" -f message="Heartbeat: keep the website updates and alerts switched on" \
              -f content="$(printf '%s\n' "$text" | base64 -w0)" ${sha:+-f sha="$sha"} >/dev/null \
              && echo "Keep-alive: heartbeat committed (last commit was $last)." || echo "Keep-alive: heartbeat commit failed."
          fi

          alerts=$(gh run list --repo "$R" --workflow alerts.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null)
          if [ "$alerts" = "0" ]; then
            echo "Watchdog: the Highest alerts loop is not running; starting it."
            gh workflow run alerts.yml --repo "$R" --ref main
          fi

          for try in 1 2 3 4 5 6; do
            gh workflow run update-site.yml --repo "$R" --ref main && exit 0
            echo "Could not start the next update (try $try); trying again in 30 s."
            sleep 30
          done
          echo "Giving up; the alerts loop or the hourly schedule will restart the updates."
          exit 1
