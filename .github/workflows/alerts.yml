# Highest alerts: checks every 5 minutes whether a new Claude, Gemini or GPT model was officially released, or a
# major AI breakthrough happened, and notifies you (alerts.py explains the rules).
# Notifications: a GitHub issue that @mentions you (GitHub mobile app push + email). Optional louder push: install
# the ntfy app, subscribe to a long random topic name, and save that name as the repository secret NTFY_TOPIC.
#
# Why a loop: GitHub delays and drops frequent cron schedules (the old "*/5" schedule really ran every 3-7 hours).
# So one run stays up for about 5 h 20 min, checks every 5 minutes, then starts the next run itself. The hourly
# schedule is only a backup that restarts the loop if the chain ever breaks; the concurrency group keeps it to one
# loop at a time. Actions minutes are free for public repositories.
name: Highest alerts

on:
  schedule:
    - cron: "17 * * * *"   # backup only; the loop below does the 5-minute checks
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["alerts.py", ".github/workflows/alerts.yml"]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "httpx>=0.27" certifi

      - uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - id: run
        name: Check every 5 minutes for about 5 hours
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKBENCH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_INPUT: ${{ inputs.test }}
          LOOP_SECONDS: "19200"   # 5 h 20 min, inside the 6-hour job limit
          INTERVAL: "300"
        run: |
          start=$(date +%s); n=0; changed=false
          while :; do
            n=$((n + 1)); t0=$(date +%s)
            out=$(mktemp)
            if [ "$n" = 1 ]; then export ALERT_TEST="$TEST_INPUT"; else export ALERT_TEST=false; fi
            GITHUB_OUTPUT="$out" python alerts.py --state alerts/state.json || echo "Check $n failed; trying again next round."
            grep -q '^changed=true' "$out" && changed=true
            # A new alert ends this loop early: the state is saved right away (next step), so the website, which
            # rebuilds itself every 10 minutes, shows the alert within minutes. The next loop starts immediately.
            if grep -q '^new_alerts=true' "$out"; then
              rm -f "$out"
              echo "New alert: saving it now so the website shows it."
              break
            fi
            rm -f "$out"

            # Watchdog for the website. Its updates are a chain of runs (each starts the next), so one is always
            # queued or running; if none is, the chain broke and is restarted here, within 5 minutes.
            site=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-site.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || true)
            if [ "$site" = "0" ]; then
              echo "Watchdog: no website update is running; restarting the updates."
              gh workflow run update-site.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            # Once an hour: if no update has succeeded for 3 hours (so restarting did not help), tell the owner
            # with one GitHub issue. No second issue is opened while that one is still open.
            if [ $((n % 12)) = 1 ]; then
              ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-site.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
              if [ -n "$ok" ] && [ $(( $(date +%s) - $(date -d "$ok" +%s) )) -gt 10800 ]; then
                open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Website updates have stopped"' --json number --jq 'length' 2>/dev/null || echo 1)
                if [ "$open" = "0" ]; then
                  gh issue create --repo "$GITHUB_REPOSITORY" --title "Website updates have stopped" \
                    --body "@$GITHUB_REPOSITORY_OWNER The website has had no successful update for more than 3 hours (last one: $ok), and restarting it automatically did not help. Open the Actions tab, look at the newest failed 'Update website' run to see the error, then close this issue once updates work again." || true
                fi
              fi
            fi

            now=$(date +%s)
            [ $((now - start + INTERVAL)) -ge "$LOOP_SECONDS" ] && break
            sleep $(( INTERVAL - (now - t0) > 5 ? INTERVAL - (now - t0) : 5 ))
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Ran $n checks."

      - name: Save what was already alerted
        if: always() && hashFiles('alerts/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}

      - name: Start the next 5-minute loop
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Keep-alive (see update-site.yml): keeps GitHub from switching the workflows off after 60 quiet days
          for wf in update-site.yml alerts.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null || echo "Keep-alive: could not re-enable $wf."
          done
          for try in 1 2 3 4 5 6; do
            gh workflow run alerts.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "Could not start the next loop (try $try); trying again in 30 s."
            sleep 30
          done
          echo "Giving up; the website updates or the hourly schedule will restart this loop."
          exit 1
